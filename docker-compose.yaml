services:
  redis:
    image: redis:alpine
    expose:
      - 6379
    restart: always
    environment:
      - REDIS_REPLICATION_MODE=master

  backend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile
    restart: always
    links:
      - redis
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: worker/docker/Dockerfile
    restart: always
    links:
      - redis
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/docker/Dockerfile
    links:
      - backend
    depends_on:
      - backend
    ports:
      - 81:81