networks:
  web:
    external: true
  default:
    external: false

services:
  redis:
    image: redis:alpine
    expose:
      - 6379
    restart: always
    environment:
      - REDIS_REPLICATION_MODE=master
    networks:
      - default

  backend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile
    restart: always
    links:
      - redis
    depends_on:
      - redis
    networks:
      - default

  worker:
    build:
      context: .
      dockerfile: worker/docker/Dockerfile
    restart: always
    links:
      - redis
    depends_on:
      - redis
    networks:
      - default

  frontend:
    build:
      context: .
      dockerfile: frontend/docker/Dockerfile
    ports:
      - 127.0.0.1:8080:8083
    links:
      - backend
    depends_on:
      - backend
    networks:
      - web
      - default